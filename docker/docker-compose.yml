services:
  mysql:
    image: mysql:8.4
    container_name: customer-service-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: itwwy123@
      MYSQL_USER: itwwy
      MYSQL_PASSWORD: itwwy123@
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d
    # 健康检查：一键启动脚本靠它判断数据库是否真正就绪
    # （容器 up 之后 MySQL 还要几十秒初始化，端口通 ≠ 能用）
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
